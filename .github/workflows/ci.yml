name: 测试与构建

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 静态检查
        run: npm run lint
      - name: 飞行模型、机场与 ATC 测试
        run: npm test
      - run: npm run build
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: aero-nova-dist
          path: dist/
          retention-days: 14
